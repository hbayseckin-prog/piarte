{% if request.session.get('user') and request.session.get('user').get('role') == 'admin' %}
<div id="push-notification-banner" style="display:none;margin-bottom:16px;padding:12px 16px;background:#ecfeff;border:1px solid #67e8f9;border-radius:12px;color:#0f172a;">
	<div style="display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;">
		<div style="font-size:14px;">
			<strong>Odeme bildirimleri kapali.</strong>
			Staff nakit odeme aldiginda telefonunuza bildirim gelsin.
		</div>
		<button type="button" id="enable-push-notifications-btn" style="padding:8px 14px;background:#0ea5e9;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;">
			Bildirimleri Ac
		</button>
	</div>
</div>
<script>
(function () {
	function urlBase64ToUint8Array(base64String) {
		const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
		const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
		const rawData = window.atob(base64);
		const outputArray = new Uint8Array(rawData.length);
		for (let i = 0; i < rawData.length; ++i) {
			outputArray[i] = rawData.charCodeAt(i);
		}
		return outputArray;
	}

	async function subscribeToPushNotifications() {
		if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
			alert("Bu tarayici push bildirimlerini desteklemiyor.");
			return false;
		}

		const keyResp = await fetch("/api/push/vapid-public-key");
		if (!keyResp.ok) {
			alert("Bildirim servisi su an aktif degil.");
			return false;
		}
		const keyData = await keyResp.json();
		if (!keyData.publicKey) {
			alert("Bildirim anahtari bulunamadi. VAPID ayarlarini kontrol edin.");
			return false;
		}

		let permission = Notification.permission;
		if (permission === "default") {
			permission = await Notification.requestPermission();
		}
		if (permission !== "granted") {
			alert("Bildirim izni verilmedi.");
			return false;
		}

		const registration = await navigator.serviceWorker.register("/sw.js");
		let subscription = await registration.pushManager.getSubscription();
		if (!subscription) {
			subscription = await registration.pushManager.subscribe({
				userVisibleOnly: true,
				applicationServerKey: urlBase64ToUint8Array(keyData.publicKey),
			});
		}

		const resp = await fetch("/api/push/subscribe", {
			method: "POST",
			headers: { "Content-Type": "application/json" },
			credentials: "same-origin",
			body: JSON.stringify(subscription),
		});
		if (!resp.ok) {
			alert("Bildirim kaydi tamamlanamadi.");
			return false;
		}
		return true;
	}

	async function refreshPushBanner() {
		const banner = document.getElementById("push-notification-banner");
		if (!banner) return;
		if (!("Notification" in window)) {
			banner.style.display = "none";
			return;
		}
		if (Notification.permission === "granted") {
			banner.style.display = "none";
			try {
				await subscribeToPushNotifications();
			} catch (err) {
				console.warn("Push abonelik yenilenemedi", err);
			}
			return;
		}
		banner.style.display = "block";
	}

	document.addEventListener("DOMContentLoaded", function () {
		const btn = document.getElementById("enable-push-notifications-btn");
		if (btn) {
			btn.addEventListener("click", async function () {
				btn.disabled = true;
				btn.textContent = "Kaydediliyor...";
				try {
					const ok = await subscribeToPushNotifications();
					if (ok) {
						await refreshPushBanner();
					}
				} finally {
					btn.disabled = false;
					btn.textContent = "Bildirimleri Ac";
				}
			});
		}
		refreshPushBanner();
	});
})();
</script>
{% endif %}
